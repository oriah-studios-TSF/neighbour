<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neighbour - Create an Account</title>
    <script src="https://kit.fontawesome.com/08c0396a01.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="create-account-container">
        <div class="create-account-form">
            <img class="logo" src="/static/images/neighbour_logo.png" alt="">
            <div class="form-header">
                <h2><i class="fas fa-user"></i> Create Your Account</h2>
                <p>Please fill in the form below in order to create your account.</p>
            </div>
            <form class="form">
                <div class="form-group">
                    <div class="form-label">Full Names</div>
                    <div class="form-input"><i class="fas fa-user"></i> <input type="text" placeholder="Enter your full name"></div>
                </div>

                <div class="form-group">
                    <div class="form-label">Phone Number</div>
                    <div class="form-input"><i class="fas fa-phone"></i> <input type="text" placeholder="Enter your full name"></div>
                </div>

                <div class="form-group">
                    <div class="form-label">Neighbourhood</div>
                    <div class="form-input"><i class="fas fa-house"></i> <select name="" id=""><option value="">Karenpark</option><option value="">The Orchards</option></select></div>
                </div>

                <div class="form-group">
                    <div class="form-label">Email Address</div>
                    <div class="form-input"><i class="fas fa-envelope"></i> <input type="text" placeholder="Enter your full name"></div>
                </div>

                <div class="form-group">
                    <div class="form-label">Passowrd</div>
                    <div class="form-input"><i class="fas fa-lock"></i> <input type="text" placeholder="Enter your full name"></div>
                </div>

                <p class="terms">By creating a neighbour account you agree with the <a href="">Terms and Conditions</a>.</p>

                <button class="submitBtn">Create Account</button>
            </form>
            <p class="already">Already have an account? <a href="">Access account</a></p>
        </div>
    </div>
</body>
</html>
