<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neighbour</title>
    <script src="https://kit.fontawesome.com/08c0396a01.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" sizes="48x48">
    <link rel="icon" href="{{ url_for('static', filename='images/icons/icon-192x192.png') }}" type="image/png" sizes="192x192">
    <link rel="icon" href="{{ url_for('static', filename='images/icons/icon-512x512.png') }}" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icons/icon-180x180.png') }}">
    <meta name="theme-color" content="#0438ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="neighbour">
</head>
<body>
    <div class="main-container">
        <section class="home" id="home">
            <div class="home-header">
                <img class="logo" src="{{ url_for('static', filename='images/neighbour_logo.png') }}" alt="neighbour Logo">
                <span class="alert-code safe">C-Green</span>
            </div>

            <div class="home-panic-alert">
                <h1>Emergency help needed?</h1>
                <p>Hold the button to transmit emergency.</p>
                <button class="panicBtn" id="panicBtn"><i class="fas fa-broadcast-tower"></i></button>
                <p><i class="fas fa-exclamation-triangle"></i> Only press in real emergencies - not for testing.</p>
            </div>

        </section>

        <section id="chat" class="chat">
            <div class="chat-header">
                <h2><i class="fas fa-message"></i> Community Chat</h2>
                <span id="onlineUsers"></span>
            </div>

            <div class="chat-panel">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Type your message here">
                    <button type="button" id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <section id="alerts" class="alerts">
            <h1>Alerts</h1>
        </section>

        <section id="profile" class="profile">
            <h1>Profile</h1>
            <div class="notification-settings">
                <h2>Notification Settings</h2>
                <button type="button" id="enableNotificationsBtn"><i class="fas fa-bell"></i> Enable Notifications</button>
                <p id="notificationStatus"></p>
            </div>
            <div class="logout">
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            </div>
        </section>

        <div class="navigation">
            <div class="navigation-button">
                <button class="active" id="homeBtn" type="button"><i class="fas fa-home"></i>Home</button>
            </div>

            <div class="navigation-button">
                <button id="chatBtn" type="button"><i class="fas fa-message"></i> Chat <span id="unreadMessages"></span></button>
            </div>

            <div class="navigation-button">
                <button id="alertBtn" type="button"><i class="fas fa-bell"></i>Alerts</button>
            </div>

            <div class="navigation-button">
                <button id="profileBtn" type="button"><i class="fas fa-user"></i>Profile</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = '{{ current_user.name }}';
    </script>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
